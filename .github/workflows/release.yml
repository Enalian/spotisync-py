name: Build and Push Docker Image (Native Multi-Arch)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например, v7.3.19)"
        required: true
        default: "v7.3.19"
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-architecture:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm # Нативный ARM-раннер без эмуляции QEMU
            platform: linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.event.release.tag_name }}
            type=raw,value=${{ matrix.arch }}

      - name: Build and push architecture-specific image
        uses: docker/build-push-action@v6
        with:
          context: ./spotisync
          file: ./spotisync/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,scope=build-${{ matrix.arch }},mode=max

  push-manifest:
    name: Push Multi-Arch Manifest (SemVer)
    needs: build-architecture
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch semver tags
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          # Убираем префикс 'v' для парсинга (если он есть)
          CLEAN_TAG="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_TAG"

          # Определяем, был ли префикс 'v' в оригинальном теге
          HAS_V=""
          [[ "$TAG" == v* ]] && HAS_V="v"

          # Формируем список тегов для мультиархитектурного манифеста
          BUILDX_ARGS=("-t" "$FULL_IMAGE:latest" "-t" "$FULL_IMAGE:$TAG")

          if [[ -n "$MAJOR" && -n "$MINOR" && -n "$PATCH" ]]; then
            BUILDX_ARGS+=("-t" "$FULL_IMAGE:${HAS_V}${MAJOR}")
            BUILDX_ARGS+=("-t" "$FULL_IMAGE:${HAS_V}${MAJOR}.${MINOR}")
            # Дубликаты без буквы 'v'
            BUILDX_ARGS+=("-t" "$FULL_IMAGE:${MAJOR}")
            BUILDX_ARGS+=("-t" "$FULL_IMAGE:${MAJOR}.${MINOR}")
          fi

          echo "Создаем мультиархитектурные манифесты для тегов: ${BUILDX_ARGS[*]}"

          # Объединяем amd64 и arm64 под всеми тегами
          docker buildx imagetools create \
            "${BUILDX_ARGS[@]}" \
            "$FULL_IMAGE:amd64" \
            "$FULL_IMAGE:arm64"
