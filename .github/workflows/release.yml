name: Build Release (Docker & Linux Binaries)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например, v7.3.19)"
        required: true
        default: "v7.3.19"
        type: string

env:
  REGISTRY: ghcr.io

permissions:
  contents: write
  packages: write

jobs:
  # ==========================================
  # 1. Сборка Docker образов (amd64 & arm64)
  # ==========================================
  build-docker:
    name: Docker Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository name
        run: |
          echo "IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nuitka (Docker stage)
        uses: actions/cache@v4
        with:
          path: ~/.cache/nuitka
          key: nuitka-docker-${{ matrix.arch }}-${{ hashFiles('**/requirements.txt', 'src/**/*.py') }}
          restore-keys: |
            nuitka-docker-${{ matrix.arch }}-

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.event.release.tag_name }}
            type=raw,value=${{ matrix.arch }}

      - name: Build and push architecture-specific image
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,scope=build-${{ matrix.arch }},mode=max

  # ==========================================
  # 2. Сборка нативных Linux-бинарников для релиза
  # ==========================================
  build-binaries:
    name: Compile Binary (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            bin-name: spotisync-linux-amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            bin-name: spotisync-linux-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Cache Nuitka (Binary stage)
        uses: actions/cache@v4
        with:
          path: ~/.cache/nuitka
          key: nuitka-bin-${{ matrix.arch }}-${{ hashFiles('**/requirements.txt', 'src/**/*.py') }}
          restore-keys: |
            nuitka-bin-${{ matrix.arch }}-

      - name: Install dependencies & Nuitka
        working-directory: ./
        run: pip install -r requirements.txt "nuitka[onefile]" zstandard

      - name: Compile with Nuitka
        working-directory: ./
        run: |
          python -m nuitka \
            --onefile \
            --jobs=4 \
            --output-filename=${{ matrix.bin-name }} \
            --include-package=pydantic \
            --include-package=pydantic_core \
            --include-package=pydantic_settings \
            --include-package=yt_dlp \
            --include-package=httpx \
            --include-package=mutagen \
            --lto=yes \
            src/main.py

      - name: Upload Binary to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        working-directory: ./
        run: |
          gh release upload "$RELEASE_TAG" "${{ matrix.bin-name }}" --clobber

  # ==========================================
  # 3. Пуш Multi-Arch манифеста для Docker
  # ==========================================
  push-manifest:
    name: Push Multi-Arch Manifest (SemVer)
    needs: build-docker
    runs-on: ubuntu-latest
    steps:
      # Принудительно переводим имя репозитория в нижний регистр и здесь
      - name: Lowercase repository name
        run: |
          echo "IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch semver tags
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          CLEAN_TAG="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_TAG"

          HAS_V=""
          [[ "$TAG" == v* ]] && HAS_V="v"

          BUILDX_ARGS=("-t" "$FULL_IMAGE:latest" "-t" "$FULL_IMAGE:$TAG")

          if [[ -n "$MAJOR" && -n "$MINOR" && -n "$PATCH" ]]; then
            BUILDX_ARGS+=("-t" "$FULL_IMAGE:${HAS_V}${MAJOR}")
            BUILDX_ARGS+=("-t" "$FULL_IMAGE:${HAS_V}${MAJOR}.${MINOR}")
            BUILDX_ARGS+=("-t" "$FULL_IMAGE:${MAJOR}")
            BUILDX_ARGS+=("-t" "$FULL_IMAGE:${MAJOR}.${MINOR}")
          fi

          docker buildx imagetools create \
            "${BUILDX_ARGS[@]}" \
            "$FULL_IMAGE:amd64" \
            "$FULL_IMAGE:arm64"
